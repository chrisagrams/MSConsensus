[project]
name = "spec2vec-repro"
version = "0.1.0"
description = "Reproduction of Spec2Vec (Huber et al., 2021) with W&B + convergence logging"
requires-python = ">=3.10"
dependencies = [
    "matchms>=0.24",
    "spec2vec>=0.8.0",
    "gensim>=4.3",
    "rdkit>=2023.9",
    "wandb>=0.16",
    "pyyaml>=6",
    "numpy>=1.24",
    "pandas>=2",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "pytest>=7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
