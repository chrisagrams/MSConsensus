[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gleams_repro"
version = "0.1.0"
description = "Faithful retrain of GLEAMS (Bittremieux et al. 2022) with W&B logging and convergence tracking"
requires-python = ">=3.10,<3.11"
# Deviates from upstream gleams's hard pins (TF 2.3.4 / Python 3.8 / CUDA 10.1)
# because those don't support Ada-gen GPUs. Python-level API (tf.keras,
# tensorflow_addons.optimizers.RectifiedAdam, Siamese model) is unchanged.
dependencies = [
    "tensorflow==2.13.*",
    "tensorflow-addons==0.22.*",
    "numpy>=1.23,<1.25",
    "scipy>=1.10,<1.12",
    "pandas>=2.0,<2.2",
    "numba>=0.57,<0.59",
    "pyarrow>=12,<16",
    "pyteomics>=4.6",
    "spectrum_utils==0.3.5",
    "h5py>=3.9,<3.11",
    "fastcluster>=1.2",
    "scikit-learn>=1.3,<1.5",
    "click>=7.1,<9",
    "pyyaml>=6.0",
    "wandb>=0.16,<0.18",
    "tqdm>=4.66",
]

[project.scripts]
gleams-repro = "gleams_repro.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]
