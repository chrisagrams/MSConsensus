# Paper-faithful retrain on the original Prosit fragmentation training set
# (Gessulat et al. 2019), staged as parquet via scripts/hdf5_to_parquet.py from
# figshare files traintest_hcd.hdf5 + holdout_hcd.hdf5.

run_name: prosit_paper

data:
  train_parquet: prosit/data/processed/prosit_paper/train.parquet
  val_parquet:   prosit/data/processed/prosit_paper/val.parquet
  test_parquet:  prosit/data/processed/prosit_paper/holdout.parquet
  val_ratio: null              # explicit split, no auto val carve
  sequence_column: modified_sequence
  label_column: intensities_raw
  model_features:
    - collision_energy_aligned_normed
    - precursor_charge_onehot

model:
  seq_length: 30
  with_termini: false
  use_meta_data: true
  use_prosit_ptm_features: false
  embedding_output_dim: 16
  recurrent_layers_sizes: [256, 512]
  regressor_layer_size: 512
  dropout_rate: 0.2
  latent_dropout_rate: 0.1

optim:
  optimizer: adam
  learning_rate: 1.0e-4
  grad_clip_norm: 1.0
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 5
    min_lr: 1.0e-7

training:
  # Paper: Adam(1e-4), batch 1024, trained for 32 epochs (per Gessulat 2019).
  batch_size: 1024
  num_epochs: 32
  early_stop_patience: 0       # disabled: paper used a fixed budget, not ES
  seed: 42

hardware:
  device: auto
  num_workers: 16          # DataLoader workers; bump if GPU util < 90%
  prefetch_factor: 4       # batches each worker buffers ahead
  pin_memory: true

logging:
  wandb_project: msbench-prosit
  wandb_entity: CS_Pharm
  wandb_mode: online
  log_every_n_steps: 50
  checkpoint_dir: prosit/models/paper
  log_dir: prosit/logs/paper

convergence:
  enabled: true
  eval_every_n_epochs: 1
  per_charge: true
  charges: [1, 2, 3, 4, 5, 6]
