###
# Per-dataset overlay for the new_match_15M run, PEPTIDE-DISJOINT split.
# Deep-merged over casanovo_paper.yaml by casanovo_repro.train.
#
# Same source MGFs as consensus_15m_file, but reshard_match15m_pepdisjoint.py
# routes each spectrum into {train, valid, test} by sha256(SEQ) mod 100:
#   buckets 0..3   -> test   (~4%, ~580K spectra)
#   buckets 4..7   -> valid  (~4%)
#   buckets 8..99  -> train  (~92%, ~13.4M)
# Hashing on the full SEQ string keeps every charge state of a given modified
# peptide together. Output is 25 sharded MGFs per split (one per source file).
###
random_seed: 457
# lance_dir is the v5-normalized output of normalize_lance_to_v5.py
# (C[57.0215] -> C[Carbamidomethyl], M[15.9949] -> M[Oxidation]),
# rsync'd to Eagle. Preprocessing was done locally; train on Polaris.
lance_dir: data/new_match_15M/lance_v5_pepdisjoint

_repro:
  dataset: consensus_15m_pepdisjoint
  autoresume: true
  # Each split is the union of 25 per-source-file shards. depthcharge accepts
  # a list of MGFs as input, so we don't concatenate.
  train_mgf:
    - casanovo/data/new_match_15M/mgf_pepdisjoint/train/consensus_00.mgf
    - casanovo/data/new_match_15M/mgf_pepdisjoint/train/consensus_01.mgf
